name: Label wall requests

# The form cannot set labels itself: GitHub drops them for authors without push access,
# which is every contributor this form exists for. So the repository does it on arrival
# and then tells the agents' side, through a webhook, that there is work.
#
# What counts as "from the form": GitHub records the app an issue was created through in
# `performed_via_github_app`, and only the app's own token can set that. The marker in the
# body is a courtesy for readers; anyone can type it, so it is not the gate.
#
# Runs on its own when an issue opens. Run it by hand with an issue number to send that
# issue again: Actions -> this workflow -> Run workflow, or
# `gh workflow run label-wall.yml -f issue=<number>`.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue to label and send to the webhook again
        required: true
        type: number

permissions:
  issues: write

jobs:
  label:
    name: Add the wall label and notify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number || inputs.issue }}
      # The wall's GitHub App (public: GET /apps/flopbut-pl). Same value as APP_ID in src/config.ts.
      APP_ID: '4885332'
      # The URL is a secret: it is the only credential, and the repository is public.
      WALL_WEBHOOK_URL: ${{ secrets.WALL_WEBHOOK_URL }}

    steps:
      # Always read the issue from the API so the event and the manual run share one path.
      - name: Read the issue
        id: issue
        run: |
          gh api "repos/$REPO/issues/$NUMBER" > issue.json
          if jq -e --argjson app "$APP_ID" '.performed_via_github_app.id == $app' issue.json > /dev/null; then
            echo "wall=true" >> "$GITHUB_OUTPUT"
          else
            echo "wall=false" >> "$GITHUB_OUTPUT"
            echo "Issue #$NUMBER was not created through the wall's GitHub App; nothing to do."
          fi

      - name: Add the wall label
        if: steps.issue.outputs.wall == 'true'
        run: gh issue edit "$NUMBER" --repo "$REPO" --add-label wall

      # Issue fields go through jq from the file, never inline, so a body cannot inject
      # into the shell.
      - name: Notify the webhook
        if: steps.issue.outputs.wall == 'true' && env.WALL_WEBHOOK_URL != ''
        run: |
          payload="$(jq -c --arg repo "$REPO" '{
            event: "wall-request",
            repository: $repo,
            issue: {number, url: .html_url, title, body},
            author: .user.login,
            created_at
          }' issue.json)"
          curl -fsS -X PUT \
            -H 'content-type: application/json' \
            -H 'user-agent: flopbut.pl wall' \
            --data "$payload" "$WALL_WEBHOOK_URL"
